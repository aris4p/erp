<!doctype html>
<html lang="en">
  <head>
    <base href="/" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>
      404 Error Page | TailAdmin - Tailwind CSS Admin Dashboard Template
    </title>
  <link rel="icon" href="favicon.ico"><link href="style.css" rel="stylesheet"></head>
  <body
    x-data="{ page: 'error404', 'loaded': true, 'darkMode': false, 'stickyMenu': false, 'sidebarToggle': false, 'scrollTop': false }"
    x-init="
         darkMode = JSON.parse(localStorage.getItem('darkMode')) ?? false;
         $watch('darkMode', value => localStorage.setItem('darkMode', JSON.stringify(value)))"
    :class="{'dark bg-gray-900': darkMode === true}"
  >
    <!-- ===== Preloader Start ===== -->
    <div
  x-show="loaded"
  x-init="window.addEventListener('DOMContentLoaded', () => {setTimeout(() => loaded = false, 500)})"
  class="fixed top-0 left-0 z-999999 flex h-screen w-screen items-center justify-center bg-white dark:bg-black"
>
  <div
    class="h-16 w-16 animate-spin rounded-full border-4 border-solid border-brand-500 border-t-transparent"
  ></div>
</div>

    <!-- ===== Preloader End ===== -->

    <!-- ===== Page Wrapper Start ===== -->
    <div
  class="relative z-1 flex min-h-screen flex-col items-center justify-center overflow-hidden p-6"
>
  <!-- ===== Common Grid Shape Start ===== -->
  <div
  class="absolute top-0 right-0 -z-1 w-full max-w-62.5 xl:max-w-112.5 rtl:right-auto rtl:left-0 rtl:-scale-x-100"
>
  <img src="./images/shape/grid-01.svg" alt="grid" />
</div>
<div
  class="absolute bottom-0 left-0 -z-1 w-full max-w-62.5 rotate-180 xl:max-w-112.5 rtl:right-0 rtl:left-auto rtl:-scale-x-100"
>
  <img src="./images/shape/grid-01.svg" alt="grid" />
</div>

  <!-- ===== Common Grid Shape End ===== -->

  <div class="mx-auto w-full max-w-60.5 text-center sm:max-w-118">
    <h1
      class="text-title-md xl:text-title-2xl mb-8 font-bold text-gray-800 dark:text-white/90"
      x-text="$t('notFound.error')"
    >
      ERROR
    </h1>

    <img
      src="./images/error/404.svg"
      alt="404"
      class="dark:hidden"
      width="472"
      height="152"
    />
    <img
      src="./images/error/404-dark.svg"
      alt="404"
      class="hidden dark:block"
      width="472"
      height="152"
    />

    <p
      class="mt-10 mb-6 text-base text-gray-700 sm:text-lg dark:text-gray-400"
      x-text="$t('notFound.message')"
    >
      We can’t seem to find the page you are looking for!
    </p>

    <a
      href="index.html"
      class="inline-flex items-center justify-center rounded-lg border border-gray-300 bg-white px-5 py-3.5 text-sm font-medium text-gray-700 shadow-theme-xs transition-all hover:bg-gray-50 hover:text-gray-800 focus-visible:ring-3 focus-visible:ring-gray-300/50 active:translate-y-px dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-gray-700/50 dark:hover:text-white"
      x-text="$t('notFound.backHome')"
    >
      Back to Home Page
    </a>
  </div>

  <!-- Footer -->
  <p
    class="absolute inset-s-1/2 bottom-6 -translate-x-1/2 text-center text-sm text-gray-500 rtl:translate-x-1/2 dark:text-gray-400"
  >
    &copy; <span x-text="new Date().getFullYear()"></span> - TailAdmin
  </p>
</div>
<!-- ===== Page Wrapper End ===== -->
  <script defer src="bundle.js"></script></body>
</html>
